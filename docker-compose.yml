services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neovpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-neovpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neovpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neovpn

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neovpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neovpn}?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      APP_URL: ${APP_URL:-http://localhost}
      NODE_ENV: production
      REMNAWAVE_API_URL: ${REMNAWAVE_API_URL:-}
      REMNAWAVE_API_KEY: ${REMNAWAVE_API_KEY:-}
      REMNAWAVE_SQUAD_NAME: ${REMNAWAVE_SQUAD_NAME:-MainSquad}
      BACKUP_DIR: /app/backups
    volumes:
      - backup_data:/app/backups
    networks:
      - neovpn

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neovpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neovpn}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    networks:
      - neovpn

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - neovpn

volumes:
  postgres_data:
  backup_data:

networks:
  neovpn:
    driver: bridge

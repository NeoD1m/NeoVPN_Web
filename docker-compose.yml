services:
  postgres:
    image: postgres:16-alpine
    container_name: neovpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neovpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-neovpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neovpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neovpn

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neovpn-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neovpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neovpn}?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      APP_URL: ${APP_URL:-https://neo-vpn.com}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      REMNAWAVE_API_URL: ${REMNAWAVE_API_URL:-}
      REMNAWAVE_API_KEY: ${REMNAWAVE_API_KEY:-}
      REMNAWAVE_SQUAD_NAME: ${REMNAWAVE_SQUAD_NAME:-MainSquad}
      BACKUP_DIR: /app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backup_data:/app/backups
    networks:
      - neovpn
      - caddy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neovpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neovpn}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      NPM_CONFIG_PRODUCTION: "false"
    networks:
      - neovpn

volumes:
  postgres_data:
  backup_data:

networks:
  neovpn:
    driver: bridge
  caddy:
    external: true
    name: ${CADDY_NETWORK:?CADDY_NETWORK is required — Docker network shared with Caddy}
